<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg"
                  x1="0" y1="0"
                  x2="1" y2="1">
    <stop offset="0%" stop-color="#0B132B"/>
    <stop offset="48%" stop-color="#1C2948"/>
    <stop offset="100%" stop-color="#3B5875"/>
  </linearGradient>

  <!-- CYAN -->
  <linearGradient id="cyan"
                  x1="0" y1="0"
                  x2="1" y2="1">
    <stop offset="0%" stop-color="#59C3C3"/>
    <stop offset="100%" stop-color="#3B9FA6"/>
  </linearGradient>

  <!-- GLASS -->
  <linearGradient id="glass"
                  x1="0" y1="0"
                  x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".035"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid"
           width="28"
           height="28"
           patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28"
          fill="none"
          stroke="#59C3C3"
          stroke-opacity=".08"/>
  </pattern>

  <!-- SHADOW -->
  <filter id="shadow"
          x="-30%"
          y="-30%"
          width="160%"
          height="180%">
    <feDropShadow
      dx="0"
      dy="18"
      stdDeviation="18"
      flood-color="#000"
      flood-opacity=".32"/>
  </filter>

  <!-- GLOW -->
  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">
    <feGaussianBlur
      stdDeviation="7"
      result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">
    <feGaussianBlur
      stdDeviation="2.5"
      result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="clip">
    <rect width="1200"
          height="500"
          rx="24"/>
  </clipPath>

</defs>


<g clip-path="url(#clip)">


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200"
      height="500"
      fill="url(#bg)"/>

<rect x="430"
